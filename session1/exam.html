<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC A – Buổi 1: Thi Thử</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="exam.css" />
</head>
<body>

  <!-- ===== TOPBAR ===== -->
  <nav class="exam-topbar">
    <a href="../index.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Danh sách
    </a>
    <div class="exam-topbar-center">
      <span class="exam-topbar-label">Phần Tiếp Theo: Thi Thử</span>
      <span class="exam-topbar-subtitle">Part 1 - 20 Câu</span>
    </div>
    <div class="exam-topbar-right">
      <button class="exam-submit-btn" id="submitBtn">Nộp bài</button>
    </div>
  </nav>
  
  <!-- ===== GLOBAL AUDIO (Optional for auto-play) ===== -->
  <div class="global-audio-bar">
    <button id="playAllBtn" class="play-all-btn">▶ Phát Audio Liên Tục</button>
    <span id="audioStatus" class="audio-status">Đang dừng</span>
  </div>

  <!-- ===== MAIN LIST ===== -->
  <main class="exam-container" id="examList">
    <!-- Rendered by JS -->
  </main>

  <!-- ===== RESULT MODAL ===== -->
  <div class="exam-modal-overlay" id="resultOverlay">
    <div class="exam-modal">
      <div class="exam-modal-header">
        <h2>Kết quả thi thử</h2>
        <button id="resultClose" class="modal-close">✕</button>
      </div>
      <div class="exam-modal-body">
        <div class="score-circle">
          <span class="score-num" id="scoreNum">0</span>
          <span class="score-deno">/ 20</span>
        </div>
        <p class="score-label" id="scoreLabel">Cần cố gắng thêm!</p>
        <div class="exam-breakdown" id="examBreakdown"></div>
      </div>
      <div class="exam-modal-footer">
        <button class="btn-review" id="reviewBtn">Xem đáp án</button>
        <button class="btn-redo" id="redoBtn">Làm lại</button>
      </div>
    </div>
  </div>

  <script src="exam.js"></script>
</body>
</html>
